name: TS Build

# 只为 feat/tailscale-latest 分支编译 Linux 二进制（amd64 + arm64），
# 用于验证「最新 Alpha + Tailscale 特性」能否正常编译，并直接下载产物。
on:
  workflow_dispatch:
  push:
    branches:
      - feat/tailscale-latest
    paths-ignore:
      - "docs/**"
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { output: amd64, goarch: amd64, goamd64: v1 }
          - { output: arm64, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          check-latest: false

      - name: Verify Go
        run: go version && go env

      - name: Set variables
        run: |
          VERSION="alpha-ts-$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILDTIME=$(date)" >> $GITHUB_ENV
          echo "CGO_ENABLED=0" >> $GITHUB_ENV
          echo "GOTOOLCHAIN=local" >> $GITHUB_ENV

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Build core
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          go build -v -tags "with_gvisor" -trimpath \
            -ldflags "-extldflags --static -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          cp mihomo mihomo-linux-${{ matrix.output }}-${VERSION}
          ls -lh mihomo-linux-${{ matrix.output }}-${VERSION}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-linux-${{ matrix.output }}
          path: mihomo-linux-${{ matrix.output }}-*
          if-no-files-found: error
